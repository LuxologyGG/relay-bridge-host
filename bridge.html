<!DOCTYPE html><html><head><meta charset="utf-8"><title>relay-bridge</title></head>
<body>
<div><input id="u" style="width:60%" placeholder="ws url"><button id="c">connect</button><span id="st">idle</span></div>
<div><textarea id="cmd" style="width:90%;height:80px"></textarea><button id="s">send</button></div>
<pre id="log" style="white-space:pre-wrap;font-size:11px"></pre>
<script>
let ws=null;
const log=(m)=>{const l=document.getElementById('log');l.textContent+=m+"\n---\n";l.scrollTop=l.scrollHeight;};
document.getElementById('c').onclick=()=>{
  const url=document.getElementById('u').value;
  document.getElementById('st').textContent='connecting';
  ws=new WebSocket(url);
  ws.onopen=()=>{document.getElementById('st').textContent='OPEN';log('[open]');};
  ws.onclose=(e)=>{document.getElementById('st').textContent='CLOSED '+e.code;log('[close '+e.code+']');};
  ws.onerror=()=>{document.getElementById('st').textContent='ERROR';log('[error]');};
  ws.onmessage=(ev)=>{log(ev.data.slice(0,20000));};
};
document.getElementById('s').onclick=()=>{
  const m=document.getElementById('cmd').value;
  if(ws&&ws.readyState===1){ws.send(m);log('>> sent '+m.slice(0,120));}else{log('!! not open');}
};
</script></body></html>
